version: '3.9'

services:

  ldap:
    image: osixia/openldap:latest
    container_name: ldap_server
    environment:
      LDAP_ORGANISATION: "Empresa"
      LDAP_DOMAIN: "empresa.local"
      LDAP_ADMIN_PASSWORD: "admin123"
    ports:
      - "389:389"


  web:
    build: ./web
    container_name: web_app
    ports:
      - "8080:80"
    depends_on:
      - ldap
